name: Trigger build on PR comment
# Trigger a build when a comment is made on a PR with /build in the comment body
# We can do the following builds: container, linux, windows, macos
# e.g. /build container=amd64
# e.g. /build container=arm64,s390x
# e.g. /build container=all
# e.g. /build linux=<targets>
# e.g. /build linux=all
# e.g. /build windows
# e.g. /build macos
# e.g. /build container=amd64 linux=<targets> windows
# e.g. /build container=all macos windows
#
# Container platforms can be comma-separated list, valid values: amd64, arm64, s390x, all
# e.g. /build container=amd64,arm64
# e.g. /build container=all windows
#
# Linux targets can be comma-separated list of distros, or 'all' to use full build-config targets
# e.g. /build linux=ubuntu/20.04,centos/7 windows (ubuntu/24.04 is auto-included for integration testing)
# e.g. /build linux=ubuntu/20.04 macos (ubuntu/24.04 is auto-included)
# e.g. /build linux=all windows
# e.g. /build macos windows
# e.g. /build linux=centos/7 (ubuntu/24.04 is auto-included)
#
# If no platform is specified then nothing is done
on:
  issue_comment:

env:
  # Set once from repo variable or override here for testing
  STEP_SECURITY_EGRESS_POLICY: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'audit' }}

jobs:
  pr-build-comment:
    name: Build on PR comment
    # Ignore comments that are not on PRs (i.e. issues)
    # Trigger only if /build is present in the comment body
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/build')}}
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ github.event.issue.number }}
      # Builds should be run (they may fail)
      should-run: ${{ steps.parse.outputs.should_run }}
      # Type of build to run
      build-container: ${{ steps.parse.outputs.container }}
      build-windows: ${{ steps.parse.outputs.windows }}
      build-macos: ${{ steps.parse.outputs.macos }}
      build-linux: ${{ steps.parse.outputs.linux }}
      # Container platforms JSON array to build
      container-platforms-json: ${{ steps.parse.outputs.container_platforms_json }}
      # Linux targets matrix to build
      linux-targets-json: ${{ steps.parse.outputs.linux_targets_json }}
      # Whether to use full linux targets from build-config.json (linux=all was specified)
      use-full-linux-targets: ${{ steps.parse.outputs.use_full_linux_targets }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ env.STEP_SECURITY_EGRESS_POLICY }}
      - name: Log useful info
        run: |
          echo "PR Number is ${{ github.event.issue.number }}"
          echo "Comment ID is ${{ github.event.comment.id }}"
          echo "Comment body is $BODY"
        shell: bash
        env:
          BODY: ${{ github.event.comment.body }}

      - name: Debug
        uses: raven-actions/debug@9dbdeb7eea607a7d73411895c65987e71d59a466 # v1.2.0

      - name: Parse /build comment
        id: parse
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = (context.payload.comment?.body || '').trim();
            const firstLine = body.split('\n')[0].trim();
            const out = {
              windows: false,
              macos: false,
              containerPlatforms: [],
              linuxTargets: [],
              useFullLinuxTargets: false,
            };

            // Must start with '/build'
            if (!/^\/build\b/i.test(firstLine)) {
              core.setOutput('should_run', 'false');
              core.setOutput('container', 'false');
              core.setOutput('windows', 'false');
              core.setOutput('macos', 'false');
              core.setOutput('linux', 'false');
              core.setOutput('container_platforms_json', '[]');
              core.setOutput('linux_targets_json', '[]');
              core.setOutput('use_full_linux_targets', 'false');
              return;
            }

            const tail = firstLine.replace(/^\/build\b/i, '').trim();
            if (tail.length > 0) {
              const tokens = tail.split(/\s+/).filter(Boolean);
              for (const raw of tokens) {
                  const lower = raw.toLowerCase();
                  if (lower === 'windows') {
                      out.windows = true;
                  } else if (lower === 'macos' || lower === 'macosx' || lower === 'osx') {
                      out.macos = true;
                  } else if (lower.startsWith('container=')) {
                      // Parse container platforms: e.g. container=amd64 or container=arm64,s390x or container=all
                      const rhs = raw.slice(raw.indexOf('=') + 1);
                      const platforms = rhs.split(',').map(s => s.trim()).filter(Boolean);
                      for (const p of platforms) {
                        if (p === 'all') {
                          out.containerPlatforms.push('amd64', 'arm64', 's390x');
                        } else if (['amd64', 'arm64', 's390x'].includes(p)) {
                          out.containerPlatforms.push(p);
                        }
                      }
                      // Deduplicate
                      out.containerPlatforms = [...new Set(out.containerPlatforms)];
                    } else if (lower.startsWith('linux=')) {
                      // Parse linux targets: e.g. linux=ubuntu/20.04 or linux=ubuntu/20.04,centos/7 or linux=all
                      const rhs = raw.slice(raw.indexOf('=') + 1);
                      const arr = rhs.split(',').map(s => s.trim()).filter(Boolean);
                      if (arr.length === 1 && arr[0].toLowerCase() === 'all') {
                        // Special case: linux=all means use full targets from build-config.json
                        out.useFullLinuxTargets = true;
                        out.linuxTargets = ['all'];
                      } else {
                        out.linuxTargets.push(...arr);
                        // Ensure package testing always includes the required ubuntu/24.04 target for integration testing, even if not specified in the comment
                        if (!out.linuxTargets.some(t => t.toLowerCase() === 'ubuntu/24.04')) {
                          out.linuxTargets.push('ubuntu/24.04');
                        }
                      }
                  }
              }
            }

            const shouldRun = out.windows || out.macos || out.containerPlatforms.length > 0 || out.linuxTargets.length > 0 || out.useFullLinuxTargets;

            core.setOutput('should_run', shouldRun ? 'true' : 'false');
            core.setOutput('container', out.containerPlatforms.length > 0 ? 'true' : 'false');
            core.setOutput('windows', out.windows ? 'true' : 'false');
            core.setOutput('macos', out.macos ? 'true' : 'false');
            core.setOutput('linux', out.linuxTargets.length > 0 || out.useFullLinuxTargets ? 'true' : 'false');
            core.setOutput('container_platforms_json', JSON.stringify(out.containerPlatforms));
            core.setOutput('linux_targets_json', JSON.stringify(out.linuxTargets));
            core.setOutput('use_full_linux_targets', out.useFullLinuxTargets ? 'true' : 'false');

  get-metadata:
    name: Get build metadata
    uses: ./.github/workflows/call-get-metadata.yaml
    needs: pr-build-comment
    if: needs.pr-build-comment.outputs.should-run == 'true'
    permissions:
      contents: read
    with:
      ref: refs/pull/${{ needs.pr-build-comment.outputs.pr-number }}/merge
      get-version-from-tag: false
      use-full-linux-targets: true

  pr-build-containers:
    name: Build containers
    needs:
      - pr-build-comment
      - get-metadata
    if: needs.pr-build-comment.outputs.should-run == 'true' && needs.pr-build-comment.outputs.build-container == 'true'
    uses: ./.github/workflows/call-build-containers.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ needs.get-metadata.outputs.version }}
      ref: refs/pull/${{ needs.pr-build-comment.outputs.pr-number }}/merge
      platforms: ${{ needs.pr-build-comment.outputs.container-platforms-json }}
      nightly-build-info: ${{ needs.get-metadata.outputs.date }}
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_PUBLIC_READ_TOKEN }}
      cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
      cosign_private_key_password: ${{ secrets.COSIGN_PASSWORD }}

  pr-build-windows:
    name: Build Windows
    needs:
      - pr-build-comment
      - get-metadata
    if: needs.pr-build-comment.outputs.should-run == 'true' && needs.pr-build-comment.outputs.build-windows == 'true'
    uses: ./.github/workflows/call-build-windows-packages.yaml
    permissions:
      contents: read
    with:
      version: ${{ needs.get-metadata.outputs.version }}
      ref: refs/pull/${{ needs.pr-build-comment.outputs.pr-number }}/merge

  pr-build-macos:
    name: Build macOS
    needs:
      - pr-build-comment
      - get-metadata
    if: needs.pr-build-comment.outputs.should-run == 'true' && needs.pr-build-comment.outputs.build-macos == 'true'
    uses: ./.github/workflows/call-build-macos-packages.yaml
    permissions:
      contents: read
    with:
      version: ${{ needs.get-metadata.outputs.version }}
      ref: refs/pull/${{ needs.pr-build-comment.outputs.pr-number }}/merge

  pr-build-linux:
    name: Build Linux
    needs:
      - pr-build-comment
      - get-metadata
    if: needs.pr-build-comment.outputs.should-run == 'true' && needs.pr-build-comment.outputs.build-linux == 'true'
    uses: ./.github/workflows/call-build-linux-packages.yaml
    permissions:
      contents: read
      packages: read
    with:
      version: ${{ needs.get-metadata.outputs.version }}
      ref: refs/pull/${{ needs.pr-build-comment.outputs.pr-number }}/merge
      target-matrix: ${{ needs.pr-build-comment.outputs.use-full-linux-targets == 'true' && needs.get-metadata.outputs.linux-targets || needs.pr-build-comment.outputs.linux-targets-json }}

  test-packages:
    name: Test packages
    needs:
      - pr-build-comment
      - pr-build-linux
      - get-metadata
    uses: ./.github/workflows/call-test-packages.yaml
    permissions:
      contents: read
      packages: read
    with:
      build-matrix: ${{ needs.pr-build-comment.outputs.use-full-linux-targets == 'true' && needs.get-metadata.outputs.linux-targets || needs.pr-build-comment.outputs.linux-targets-json }}
      version: ${{ needs.get-metadata.outputs.version }}
      ref: refs/pull/${{ needs.pr-build-comment.outputs.pr-number }}/merge
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_PUBLIC_READ_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  pr-build-comment-response:
    name: Respond to PR comment
    if: always()
    needs:
      - pr-build-comment
      - pr-build-containers
      - pr-build-windows
      - pr-build-macos
      - pr-build-linux
      - test-packages
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ env.STEP_SECURITY_EGRESS_POLICY }}

      - name: Post results as PR comment
        if: needs.pr-build-comment.outputs.should-run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.pr-build-comment.outputs.pr-number }}
          CONTAINER_REQUESTED: ${{ needs.pr-build-comment.outputs.build-container }}
          WINDOWS_REQUESTED: ${{ needs.pr-build-comment.outputs.build-windows }}
          MACOS_REQUESTED: ${{ needs.pr-build-comment.outputs.build-macos }}
          LINUX_REQUESTED: ${{ needs.pr-build-comment.outputs.build-linux }}
          CONTAINER_PLATFORMS_JSON: ${{ needs.pr-build-comment.outputs.container-platforms-json }}
          LINUX_TARGETS_JSON: ${{ needs.pr-build-comment.outputs.linux-targets-json }}
          CONTAINER_RESULT: ${{ needs.pr-build-containers.result }}
          WINDOWS_RESULT: ${{ needs.pr-build-windows.result }}
          MACOS_RESULT: ${{ needs.pr-build-macos.result }}
          LINUX_RESULT: ${{ needs.pr-build-linux.result }}
          TEST_PACKAGES_RESULT: ${{ needs.test-packages.result }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const run_id = context.runId;

            // Gather job URLs
            const byName = {};
            for await (const { data } of github.paginate.iterator(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id, per_page: 100 }
            )) {
              // data is already an array of jobs
              for (const j of data) {
                  if (!byName[j.name]) byName[j.name] = j.html_url;
              }
            }

            function statusEmoji(result) {
                if (!result) return '➖';
                const r = String(result).toLowerCase();
                if (r === 'success') return '✅';
                if (r === 'failure') return '❌';
                if (r === 'cancelled') return '🛑';
                if (r === 'skipped') return '⏭️';
                return '❓';
            }

            const requested = {
                container: process.env.CONTAINER_REQUESTED === 'true',
                windows: process.env.WINDOWS_REQUESTED === 'true',
                macos: process.env.MACOS_REQUESTED === 'true',
                linux: process.env.LINUX_REQUESTED === 'true',
            };

            const results = {
                container: process.env.CONTAINER_RESULT || 'skipped',
                windows: process.env.WINDOWS_RESULT || 'skipped',
                macos: process.env.MACOS_RESULT || 'skipped',
                linux: process.env.LINUX_RESULT || 'skipped',
                testPackages: process.env.TEST_PACKAGES_RESULT || 'skipped',
            };

            const containerPlatforms = (() => {
                try { return JSON.parse(process.env.CONTAINER_PLATFORMS_JSON || '[]'); }
                catch { return []; }
            })();

            const linuxTargets = (() => {
                try { return JSON.parse(process.env.LINUX_TARGETS_JSON || '[]'); }
                catch { return []; }
            })();

            const rows = [];
            if (requested.container) {
                const name = 'Build containers';
                const url = byName[name] || `${context.serverUrl}/${owner}/${repo}/actions/runs/${run_id}`;
                const platformsStr = containerPlatforms.length ? '`' + containerPlatforms.join('`, `') + '`' : '_none_';
                rows.push(`- Containers: ${statusEmoji(results.container)} (${results.container}) — Platforms: ${platformsStr} — [Job logs](${url})`);
            }
            if (requested.windows) {
                const name = 'Build Windows packages';
                const url = byName[name] || `${context.serverUrl}/${owner}/${repo}/actions/runs/${run_id}`;
                rows.push(`- Windows: ${statusEmoji(results.windows)} (${results.windows}) — [Job logs](${url})`);
            }
            if (requested.macos) {
                const name = 'Build macOS packages';
                const url = byName[name] || `${context.serverUrl}/${owner}/${repo}/actions/runs/${run_id}`;
                rows.push(`- macOS: ${statusEmoji(results.macos)} (${results.macos}) — [Job logs](${url})`);
            }
            if (requested.linux) {
                const name = 'Build Linux packages';
                const url = byName[name] || `${context.serverUrl}/${owner}/${repo}/actions/runs/${run_id}`;
                const targetsStr = linuxTargets.length ? '`' + linuxTargets.join('`, `') + '`' : '_none_';
                rows.push(`- Linux: ${statusEmoji(results.linux)} (${results.linux}) — Targets: ${targetsStr} — [Job logs](${url})`);
                
                const testName = 'Test packages';
                const testUrl = byName[testName] || `${context.serverUrl}/${owner}/${repo}/actions/runs/${run_id}`;
                rows.push(`- Tests: ${statusEmoji(results.testPackages)} (${results.testPackages}) — [Job logs](${testUrl})`);
            }

            const body = [
                `Build results for /build on PR #${process.env.PR_NUMBER}:`,
                '',
                ...rows,
            ].join('\n');

            await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: Number(process.env.PR_NUMBER),
                body
            });
