name: Lint package change PRs
on:
  pull_request:
    paths:
      - .github/workflows/pr-lint-packages.yaml
      # Run for any CMake or packaging changes
      - "source/cmake/**"
      - "source/cpack/**"
      - "source/init/**"
      - "source/**/CMakeLists.txt"
      - "source/packaging/distros/ubuntu/**"
  workflow_dispatch:

env:
  # Set once from repo variable or override here for testing
  STEP_SECURITY_EGRESS_POLICY: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'audit' }}

jobs:
  build-packages-for-ubuntu:
    name: Building test package for Ubuntu
    uses: ./.github/workflows/call-build-linux-packages.yaml
    permissions:
      contents: read
      packages: read
    with:
      version: "99.9.9"
      ref: ${{ github.ref }}
      target-matrix: '["ubuntu/24.04"]'

  lintian-pr:
    runs-on: ubuntu-latest
    needs:
      - build-packages-for-ubuntu
    name: PR - Lintian (Package changes)
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ env.STEP_SECURITY_EGRESS_POLICY }}

      - name: Checkout for config file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-ubuntu-24.04
          path: downloads/

      - name: Debug
        run: ls -lRh downloads/
        shell: bash

      - name: List contents
        continue-on-error: true
        run: find "downloads/" -name '*-agent_*_amd64.deb' -exec dpkg -c {} \;
        shell: bash

      - name: List control files
        continue-on-error: true
        run: |
          find "downloads/" -name '*-agent_*_amd64.deb' -exec dpkg -e {} \;
          ls -lRh DEBIAN/
        shell: bash

      - name: Install Lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian
        shell: bash

      - name: Run Lintian
        run: find "downloads/" -name '*-agent_*_amd64.deb' -exec lintian --fail-on=error --cfg $PWD/.lintian -c {} \;
        shell: bash
