---
name: Get build metadata
# This reusable workflow extracts build metadata (version, date, linux targets, OSS version)
# from the repository. It handles differences between PR builds, staging builds, and releases.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit, SHA or branch to use in this repository.
        required: false
        type: string
        default: main
      get-version-from-tag:
        description: If true, extract version from git tag (for releases); if false, from Dockerfile (for PRs/staging).
        required: false
        type: boolean
        default: false
      use-full-linux-targets:
        description: If true, use .linux_targets from build-config.json (for PR builds); if false, use .release.linux_targets (for staging/releases).
        required: false
        type: boolean
        default: true
    outputs:
      date:
        description: Nightly build date/timestamp, or empty string for releases.
        value: ${{ jobs.get-metadata.outputs.date }}
      linux-targets:
        description: JSON array of Linux build targets (full set for PRs, reduced set for staging/releases).
        value: ${{ jobs.get-metadata.outputs.linux-targets }}
      version:
        description: The build version (from Dockerfile or git tag).
        value: ${{ jobs.get-metadata.outputs.version }}
      oss-version:
        description: The OSS (Fluent Bit) version from source/oss_version.txt.
        value: ${{ jobs.get-metadata.outputs.oss-version }}
      ubi-image-base:
        description: The canonical base name for UBI container images.
        value: ${{ jobs.get-image-bases.outputs.ubi-image-base }}
      debian-image-base:
        description: The canonical base name for Debian container images.
        value: ${{ jobs.get-image-bases.outputs.debian-image-base }}

env:
  # Set once from repo variable or override here for testing
  STEP_SECURITY_EGRESS_POLICY: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'audit' }}

permissions:
  contents: read

jobs:
  get-image-bases:
    name: Get image base names
    uses: ./.github/workflows/call-get-image-base-names.yaml
    permissions:
      contents: read

  get-metadata:
    name: Get metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      date: ${{ steps.set-date.outputs.date }}
      linux-targets: ${{ steps.set-linux-targets.outputs.linux-targets }}
      version: ${{ steps.set-version.outputs.version }}
      oss-version: ${{ steps.set-oss-version.outputs.oss-version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ env.STEP_SECURITY_EGRESS_POLICY }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: telemetryforge/agent
          ref: ${{ inputs.ref }}

      - name: Debug
        uses: raven-actions/debug@9dbdeb7eea607a7d73411895c65987e71d59a466 # v1.2.0

      - name: Set nightly build date
        # May not be used for releases, but we still set it to a value for consistency
        id: set-date
        run: |
          echo "date=$(date '+%Y-%m-%d-%H_%M_%S')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Determine version output
        id: set-version
        run: |
          if [[ "${{ inputs.get-version-from-tag }}" == "true" ]]; then
            # For releases we use the tag
            TAG_NAME=${INPUT_REF#refs/tags/}
            echo "Found tag: $TAG_NAME"
            # Strip first character (the 'v')
            VERSION=${TAG_NAME:1}
          else
            # Support LTS version for backwards compatibility, but default to the new version variable
            if grep -q "ARG TELEMETRY_FORGE_AGENT_VERSION=" Dockerfile.ubi; then
              echo "Found TELEMETRY_FORGE_AGENT_VERSION in Dockerfile.ubi"
              VERSION=$(grep "ARG TELEMETRY_FORGE_AGENT_VERSION=" Dockerfile.ubi | cut -d '=' -s -f 2 -)
            else
              echo "Could not find TELEMETRY_FORGE_AGENT_VERSION in Dockerfile.ubi, attempting legacy version check for backwards compatibility"
              VERSION=$(grep "ARG FLUENTDO_AGENT_VERSION=" Dockerfile.ubi | cut -d '=' -s -f 2 -)
            fi
          fi
          echo "version=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}

      - name: Determine Linux targets output
        id: set-linux-targets
        run: |
          if [[ "${{ inputs.use-full-linux-targets }}" == "true" ]]; then
            LINUX_TARGETS=$(cat "$JSON_FILE_NAME"|jq -c .linux_targets )
          else
            LINUX_TARGETS=$(cat "$JSON_FILE_NAME"|jq -c .release.linux_targets )
          fi
          echo "linux-targets=$LINUX_TARGETS"
          echo "linux-targets=$LINUX_TARGETS" >> $GITHUB_OUTPUT
        shell: bash
        env:
          JSON_FILE_NAME: build-config.json

      - name: Get the OSS version
        id: set-oss-version
        run: |
          OSS_VERSION=$(cat source/oss_version.txt)
          echo "oss-version=$OSS_VERSION"
          echo "oss-version=$OSS_VERSION" >> $GITHUB_OUTPUT
        shell: bash
